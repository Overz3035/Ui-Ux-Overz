  # ---- SURFACE TYPE ------------------------------------------------------
  dashboard:
    aliases: ["dashboard", "admin", "console", "backoffice", "back office",
              "control panel", "analytics", "monitoring", "internal tool", "ops"]
    expands_to:
      dashboard: 1.0
