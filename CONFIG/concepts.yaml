# UIUX ENGINE — semantic concept ontology
#
# This powers local semantic search WITHOUT a neural model (§14). A natural
# language query is tokenised, matched against `aliases`, then expanded into
# `expands_to` terms which are scored against asset tags in the index.
#
# Weights: how strongly an expanded term counts relative to a literal match.
# Keep 0.3-0.9. A literal tag match always scores 1.0.

version: 1

concepts:

  # ---- QUALITY / PERSONALITY ----------------------------------------------
  premium:
    aliases: ["premium", "luxury", "high-end", "upscale", "refined", "polished",
              "expensive", "sophisticated", "elegant", "boutique"]
    expands_to:
      muted_neutral: 0.6
      high_contrast: 0.4
      minimal_spacious: 0.7
      monochrome: 0.5
      editorial_typographic: 0.5
      dark_ui: 0.35
    implies_tokens: ["generous-whitespace", "restrained-palette", "precise-type", "low-motion-intensity"]

  cinematic:
    aliases: ["cinematic", "filmic", "movie", "trailer", "dramatic", "atmospheric",
              "moody", "immersive"]
    expands_to:
      cinematic: 1.0
      dark_ui: 0.6
      gradient_rich: 0.5
      three_d_scene: 0.5
      scroll: 0.5
      parallax: 0.5
      background: 0.4
    implies_tokens: ["wide-aspect", "depth-layers", "slow-easing", "dark-surface"]

  minimal:
    aliases: ["minimal", "minimalist", "clean", "simple", "spacious", "airy",
              "quiet", "understated", "bare"]
    expands_to:
      minimal_spacious: 1.0
      muted_neutral: 0.6
      light_ui: 0.4
      monochrome: 0.5
      centered_single_column: 0.4
    implies_tokens: ["few-elements", "large-negative-space", "single-accent"]

  bold:
    aliases: ["bold", "loud", "punchy", "energetic", "vibrant", "expressive",
              "playful", "brutalist"]
    expands_to:
      vivid_saturated: 0.9
      high_contrast: 0.8
      brutalist: 0.7
      neon_cyber: 0.4
    implies_tokens: ["oversized-type", "saturated-accent", "hard-edges"]

  industrial:
    aliases: ["industrial", "enterprise", "engineering", "technical", "operational",
              "heavy", "manufacturing", "scada", "b2b", "utility", "infrastructure"]
    expands_to:
      industrial_technical: 1.0
      data_dense: 0.8
      dashboard: 0.7
      sidebar_content: 0.6
      dense_table: 0.6
      muted_neutral: 0.5
      monochrome: 0.35
    implies_tokens: ["tabular-numerals", "status-colour-system", "compact-density", "legible-at-distance"]

  trustworthy:
    aliases: ["trust", "trustworthy", "credible", "secure", "compliant",
              "institutional", "regulated", "official", "government"]
    expands_to:
      light_ui: 0.5
      muted_neutral: 0.6
      editorial_typographic: 0.4
      form: 0.4
    implies_tokens: ["conservative-palette", "explicit-labels", "visible-affordances", "no-dark-patterns"]

  futuristic:
    aliases: ["futuristic", "sci-fi", "scifi", "cyber", "hud", "space", "ai",
              "next-gen", "holographic"]
    expands_to:
      neon_cyber: 1.0
      dark_ui: 0.7
      three_d_scene: 0.6
      overlay_hud: 0.7
      gradient_rich: 0.5
    implies_tokens: ["glow-accents", "mono-accent-type", "grid-overlays"]

  # ---- DOMAIN / INDUSTRY --------------------------------------------------
  fintech:
    aliases: ["fintech", "finance", "financial", "banking", "bank", "payments",
              "trading", "invest", "wealth", "ledger", "accounting", "treasury"]
    expands_to:
      dashboard: 0.9
      data_dense: 0.8
      chart: 0.9
      data_table: 0.8
      kpi_tile: 0.8
      muted_neutral: 0.4
