  editorial_surface:
    aliases: ["blog", "article", "editorial", "magazine", "documentation", "docs",
              "long form", "reading", "content site"]
    expands_to:
      editorial: 1.0
      editorial_typographic: 1.0
      centered_single_column: 0.7
      asymmetric_editorial: 0.5
    implies_tokens: ["measure-60-75ch", "vertical-rhythm", "type-scale-contrast", "anchor-navigation"]

  # ---- MOTION / 3D -------------------------------------------------------
  motion:
    aliases: ["motion", "animation", "animated", "interaction", "transition",
              "micro-interaction", "microinteraction", "choreography"]
    expands_to:
      hover: 0.6
      micro_interaction: 0.7
