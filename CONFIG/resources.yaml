# UIUX ENGINE — RESOURCE REGISTRY
#
# Machine-readable classification of every entry in RESOURCE-LIST.md.
# The Resource Router (ENGINE/resource-router.md) reads this file to decide
# what to activate for a task. `uiux doctor` reads it to report what is
# actually installed.
#
# CONFIDENCE VOCABULARY — do not upgrade these without evidence:
#   verified-local      : presence confirmed on this machine by `uiux doctor`
#   high-confidence     : widely documented public project, stable API surface
#   needs-verification  : plausibly exists, capabilities NOT confirmed
#   unknown             : identity itself unresolved; router must not act on it
#
# `class` maps to RESOURCE-LIST.md §9:
#   active-engine | skill | library | component-source | inspiration
#   knowledge-tool | engineering-resource
#
# `activation` tells the router how the resource may be used:
#   invoke      : has an executable/native interface; call it
#   load        : markdown/knowledge; progressively load into context
#   depend      : a code dependency the implementation may install
#   consult     : reference material a human/agent reads, never auto-installed
#   concept     : ideas only; the engine reimplements them internally

version: 1

# ===========================================================================
# 1. ACTIVE ENGINES  (route work to them; preserve native behaviour)
# ===========================================================================
active_engines:

  ui-ux-pro-max:
    display_name: "UI UX Pro Max"
    class: active-engine
    priority: CRITICAL
    activation: invoke
    confidence: verified-local            # native CLI verified working 2026-09
    installed: false            # updated by `uiux doctor` (live probe wins)
    notes: >
      RESOURCE-LIST.md designates this the primary external design
      intelligence engine. NOT present on this machine as of engine build
      (probed ~/.claude/skills, ~/.claude/plugins, PATH, npm global).
      Its native command surface is therefore UNKNOWN and must not be
      guessed. ADAPTERS/ui-ux-pro-max/ performs runtime detection and
      degrades to the engine's internal design pipeline when absent.
    detection:
      # Each probe is tried in order; first hit wins. See adapters.py.
      - {kind: claude_skill,   name: "ui-ux-pro-max"}
      - {kind: claude_skill,   name: "uiux-pro-max"}
      - {kind: claude_skill,   name: "ui_ux_pro_max"}
      - {kind: claude_plugin,  name: "ui-ux-pro-max"}
      - {kind: path_binary,    name: "uiuxpromax"}
      - {kind: path_binary,    name: "ui-ux-pro-max"}
      - {kind: npm_global,     name: "ui-ux-pro-max"}
      - {kind: env_var,        name: "UI_UX_PRO_MAX_HOME"}
      - {kind: directory,      name: "ADAPTERS/ui-ux-pro-max/vendor"}
    routes:
      # Task kinds the router hands over WHEN detected.
      - design-system-generation
      - ui-ux-audit
      - product-design-guidance
      - component-spec
    fallback: "ENGINE/design-dna-engine.md + ENGINE/quality-engine.md"

