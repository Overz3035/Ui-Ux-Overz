      - "INDEX/uiux.db tables: nodes, edges (pattern<->source<->asset)"
      - "KNOWLEDGE/sources/<source-id>.md evidence cards"
    dependency: none
    note: "The engine must NOT require Obsidian. The vault is readable in it, and that is a side effect, not a coupling."

# ===========================================================================
# 7. ENGINEERING RESOURCES
# ===========================================================================
engineering_resources:

  horizonx:
    display_name: "Open Horizons (requested source: open-horizon-labs/skills)"
    class: engineering-resource
    activation: consult
    confidence: verified-remote            # repo inspected + installed 2026-09
    site: "https://github.com/open-horizon-labs/skills"
    install: "npx skills add open-horizon-labs/skills -g -a claude-code -y"
    verified: >
      2026-09: RESOURCE-LIST §5 'Horizonx' resolved by the requester to
      github.com/open-horizon-labs/skills - 'Agent skills for the Open
      Horizons strategic execution framework', MIT. IMPORTANT
      RECLASSIFICATION: this is NOT a design/visual inspiration source -
      it is a strategic-execution harness (12 skills: /aim, /problem-space,
      /problem-statement, /problem-weave, /solution-space, /execute,
      /ship, /review, /dissent, /salvage, /distill, /teach-oh). Companion
      benchmark claims 7/9 vs 1/9 hidden-pass improvement on same runner.
      INSTALLED globally via the skills CLI (aim, problem-space,
      problem-statement, problem-weave, solution-space, execute, ship,
      review, dissent, salvage, distill, teach-oh present).
    decision: >
      Kept out of the design routing table on purpose (RESOURCE-LIST §9
      class distinction + §1 scope guard): strategic-execution commands do
      not inform visual/UX decisions. Useful as a project-management layer
      around engine tasks (frame -> execute -> review -> distill), which
      the master skill's pipeline already provides in design-specific form.
    routes: [project-grounding, execution-discipline]
    detection:
      - {kind: claude_skill, name: "aim"}
      - {kind: claude_skill, name: "problem-space"}
      - {kind: claude_skill, name: "teach-oh"}

  ecc:
    display_name: "ECC"
    class: engineering-resource
    activation: consult
    confidence: verified-local            # repo inspected + installed 2026-09
    repo: "https://github.com/affaan-m/ECC"
    verified: >
      2026-09: repo inspected and INSTALLED on this machine. "The agent
      harness performance optimization system" - MIT, ~248k stars. Provides
      68 agents, 286 skills, 94 commands, hooks, memory, continuous
      learning, AgentShield scanning. Install performed:
      `npx ecc-universal install --profile minimal --target claude`
      (488 file operations into ~/.claude: 22 rule packs under rules/ecc,
      50 skills flattened into ~/.claude/skills, agents, commands, memory
      skill). Hooks were deliberately NOT installed (no --enable-hooks) so
      Claude's settings.json stays untouched. ECC docs warn against stacking
      install methods (plugin + manual = duplicates).
    decision: >
      Installed at the requester's choice (minimal profile, no hooks).
      Scope guard from RESOURCE-LIST.md §1 still applies: ECC's engineering
      workflow rules do NOT override UI/UX decision logic - the priority
      hierarchy (§4) keeps engine + project requirements above them.
    routes: [agent-workflow-ideas, engineering-principles]
    scope_guard: "Engineering workflow rules must NOT leak into UI/UX decision logic."
    detection:
      - {kind: ecc_install, name: "ecc"}

# ===========================================================================
# 8. ROUTER DECISION TABLE
# Need -> ordered candidate resources. First AVAILABLE + APPROPRIATE wins.
# "internal" always exists and always terminates the chain, so the engine can
# never be blocked by a missing external resource.
# ===========================================================================
routing:
  design-system-generation: [ui-ux-pro-max, internal]
  visual-direction:         [taste, internal]
  motion-spec:              [motion-design, internal]
  implementation:           [frontend-design, internal]
  advanced-scroll-motion:   [gsap]
  react-layout-motion:      [framer-motion]
  react-3d:                 [react-three-fiber, three]
  raw-webgl:                [three]
  shader-visuals:           [shadergradient, three, shaders]
  glass-surface:            [internal]        # liquidglass-js unresolved; see lightswind/21st-dev
  component-reference:      [21st-dev, react-bits, lightswind, uiverse]
  micro-interaction-css:    [uiverse, react-bits]
  scroll-inspiration:       [scrolltide, motionsites]
  visual-inspiration:       [getlayers, vividsites, motionsites]
  knowledge-graph:          [graphify, internal]
  local-reference-search:   [internal]

# Guardrails the router applies before it activates anything.
guards:
  - "Never activate a library the project cannot support (framework mismatch)."
  - "Never introduce a dependency when CSS or SVG meets the requirement."
  - "Never activate 3D/shader resources for text- or data-critical regions."
  - "Never let a component source dictate the project's visual language."
  - "Never fetch or execute remote code as part of a pipeline step (§38)."
  - "Resources with confidence `unknown` are reportable, not activatable."
  - "Visual references are priority 12 of 12: they lose every conflict (§4)."

