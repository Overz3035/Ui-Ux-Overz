# ===========================================================================
# 3. LIBRARIES  (implementation dependencies; install only when chosen)
# ===========================================================================
libraries:

  framer-motion:
    display_name: "Framer Motion / Motion for React"
    class: library
    activation: depend
    confidence: verified-remote            # motion.dev verified 2026-09
    package: "motion"
    alt_package: "framer-motion"
    site: "https://motion.dev"
    ecosystem: [react, js, vue]
    verified: "2026-09: motion.dev live - 'Motion (prev Framer Motion)', MIT, React/JS/Vue. On npm, `motion` is the canonical package (v13.x); `framer-motion` still exists and is depended on by motion. For NEW projects install `motion`."
    capabilities:
      - declarative-component-animation
      - layout-animation
      - shared-layout-transitions
      - presence-exit-animation
      - gesture-hover-tap-drag
      - spring-physics
      - scroll-linked-values
      - variants-orchestration
    use_when:
      - "React component enters/exits or changes layout"
      - "Gesture-driven micro-interactions"
      - "Page/route transitions inside a React router"
    avoid_when:
      - "Non-React project"
      - "A CSS transition already solves it (cheaper, no JS cost)"
      - "Long timeline choreography across unrelated DOM -> prefer GSAP"
    cost_note: "Adds JS to the bundle; prefer CSS for single-property state changes."
    verify: ["for existing projects that already use framer-motion, keep the installed alias instead of migrating mid-feature"]

  gsap:
    display_name: "GSAP (GreenSock Animation Platform)"
    class: library
    activation: depend
    confidence: high-confidence
    package: "gsap"
    site: "https://gsap.com"
    ecosystem: [vanilla, react, vue, svelte]
    capabilities:
      - timeline-sequencing
      - scroll-trigger-choreography
      - pin-and-scrub
      - complex-easing
      - svg-and-canvas-animation
      - text-splitting
      - high-performance-transform-batching
    use_when:
      - "Scroll-driven narrative with pinned sections"
      - "Multi-element timeline with precise offsets"
      - "Framework-agnostic or non-React project"
    avoid_when:
      - "A single hover state or fade"
      - "Task-oriented app surfaces where motion is decoration"
    cost_note: "Powerful and heavy; import only the plugins actually used."
    verify: ["current licence terms and which plugins are free for commercial use"]

  three:
    display_name: "Three.js"
    class: library
    activation: depend
    confidence: verified-remote            # threejs.org verified 2026-09
    package: "three"
    site: "https://threejs.org"
    ecosystem: [vanilla, react-via-r3f]
    verified: "2026-09: threejs.org live; current release line r185 on GitHub releases."
    capabilities:
      - webgl-scene-graph
      - cameras-lights-materials
      - gltf-model-loading
      - post-processing
      - custom-shader-materials
      - raycasting-interaction
    use_when:
      - "Genuine 3D content: spatial data, product inspection, configurators"
      - "Custom shader surfaces that cannot be faked with CSS/SVG"
    avoid_when:
      - "Decoration that a static image or CSS gradient would deliver"
      - "Low-power/battery-sensitive primary audience"
      - "Content-critical text (never render body copy in WebGL)"
    cost_note: "Large bundle + GPU cost. Requires poster fallback and DPR clamp."

  react-three-fiber:
    display_name: "React Three Fiber"
    class: library
    activation: depend
    confidence: high-confidence
    package: "@react-three/fiber"
    companions: ["@react-three/drei"]
    site: "https://r3f.docs.pmnd.rs"
    ecosystem: [react]
    requires: [three]
    capabilities:
      - react-reconciler-for-threejs
      - declarative-scene-composition
      - hooks-driven-render-loop
      - suspense-based-asset-loading
    use_when: ["3D inside an existing React app", "3D state shared with React UI"]
    avoid_when: ["Non-React project", "One-off canvas with no React interplay"]

  shadergradient:
    display_name: "ShaderGradient"
    class: library
    activation: depend
    confidence: verified-remote            # shadergradient.co + npm verified 2026-09
    package: "@shadergradient/react"
    site: "https://www.shadergradient.co"
    ecosystem: [react, framer]
    requires: [three, react-three-fiber]
    verified: "2026-09: shadergradient.co live ('moving gradients on Framer, Figma and React'); npm package `@shadergradient/react` v2.4.20, MIT, author ruucm, React 18/19 peer deps."
    capabilities:
      - animated-shader-gradient-background
      - parameterised-colour-and-motion
    use_when: ["Ambient brand depth behind low-density content"]
    avoid_when:
      - "Behind body text or data (contrast risk)"
      - "When a static gradient reads identically at 1/100th the cost"
    verify: ["peer-dependency range against the project's react/three versions"]

  shaders:
    display_name: "Shaders (technique knowledge)"
    class: library
    activation: concept
    confidence: verified-local
    package: ""
    site: "https://thebookofshaders.com"
    verified: >
      RESOURCE-LIST §3 lists generic shader techniques. Not a package: the
      engine encodes them as knowledge (KNOWLEDGE/three-d/shader-techniques.md)
      plus the router aliases shader-visuals -> [shadergradient, three].
      Canonical learning references: The Book of Shaders, Shadertoy.
    capabilities:
      - fragment-shader-backgrounds
      - procedural-noise-and-gradients
      - displacement-and-refraction
      - glsl-uniform-time-patterns
    use_when:
      - "Ambient background depth that CSS gradients cannot express"
      - "Hero surfaces with brand-tinted motion below conscious attention"
    avoid_when:
      - "Behind body text or data (contrast + battery cost)"
      - "When a static gradient or CSS animation reads identically"
    knowledge_card: "KNOWLEDGE/three-d/shader-techniques.md"
    cost_note: "GPU fragment cost scales with pixel count - clamp resolution and pause off-screen."

  liquidglass-js:
    display_name: "LiquidGlass.js"
    class: library
    activation: consult
    confidence: unresolvable
    package: ""
    site: ""
    notes: >
      UNRESOLVED after verification (2026-09). The commonly suggested repo
      github.com/rdev/liquid-glass returns 404 - no canonical "LiquidGlass.js"
      package or repository exists at any checked path. Several unrelated
      "liquid glass" libraries appeared following Apple's 2025 design
      language; identity remains unresolved. The router must NOT install
      anything for this entry. The *technique* (translucent layered
      surfaces) is captured vendor-neutrally in KNOWLEDGE/ui/glass-surfaces.md,
      and real production glass components exist in verified sources:
      Lightswind (liquid-glass blocks) and 21st.dev. RESOURCE-LIST.md
      explicitly warns against forcing glassmorphism where it does not fit.
    capabilities: []
    alternatives: [lightswind, 21st-dev]
    verify: ["only if the requester identifies the canonical repository"]

  tailwindcss:
    display_name: "Tailwind CSS"
    class: library
    activation: depend
    confidence: high-confidence
    package: "tailwindcss"
    site: "https://tailwindcss.com"
    capabilities: [utility-css, design-token-mapping, responsive-variants, dark-mode-variants]
    use_when: ["Project already uses it", "Token-driven system with fast iteration"]
    avoid_when: ["Existing mature CSS architecture that Tailwind would fragment"]
    note: "The engine ADAPTS to the project's existing styling approach (§23). Never introduce this into a project that has not chosen it."

